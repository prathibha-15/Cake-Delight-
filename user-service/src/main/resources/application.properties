spring.application.name=user-service

server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sweetlife&15}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# JWT Configuration (Secret must be at least 256 bits / 32 bytes for HS256)
jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1jYWtlLWRlbGlnaHQtdjItc3VwZXItc2VjcmV0LXNlY3JldC1rZXk=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Local development admin account seed (idempotent; dev/demo only, never overwrites an existing user)
admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
admin.seed.username=${ADMIN_SEED_USERNAME:admin}
admin.seed.email=${ADMIN_SEED_EMAIL:admin@cakedelight.local}
admin.seed.password=${ADMIN_SEED_PASSWORD:Admin@12345}
