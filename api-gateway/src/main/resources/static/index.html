<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cake Delight</title>
  <style>
    :root {
      --brand: #ef1b25;
      --brand-dark: #d5141f;
      --ink: #1f1f1f;
      --muted: #6c6c6c;
      --border: #e7e1dc;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      --error-bg: #fff3f3;
      --error-text: #a60f18;
      --ok-bg: #eef9ef;
      --ok-text: #0f6d2f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #ffffff 0%, #fff7f4 100%);
    }

    .topbar {
      background: var(--brand);
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
    }

    .brand {
      font-size: 2.4rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -1px;
      line-height: 1;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-note {
      font-size: 1rem;
      font-weight: 700;
      opacity: 0.92;
    }

    .user-badge-header {
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.22);
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
      font-weight: 700;
    }

    .hero {
      text-align: center;
      padding: 20px 16px 8px;
    }

    .hero h2 {
      margin: 0;
      color: var(--brand);
      font-size: clamp(1.9rem, 3vw, 3rem);
      line-height: 1.05;
    }

    .page {
      padding: 18px 26px 36px;
      max-width: 1700px;
      margin: 0 auto;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }

    .filter-chip-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-chip,
    .filter-input,
    .filter-btn {
      border: 1px solid #d8d2cd;
      background: white;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .filter-input {
      min-width: 150px;
      cursor: text;
    }

    .filter-chip:hover,
    .active-chip {
      border-color: var(--brand);
      box-shadow: 0 8px 18px rgba(239, 27, 37, 0.12);
    }

    .chip-remove {
      margin-left: 6px;
      font-weight: bold;
      color: var(--brand);
      padding: 0 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }

    .catalog-column {
      display: grid;
      gap: 16px;
      min-width: 0;
      justify-items: center;
    }

    .catalog-grid {
      display: grid;
      gap: 12px;
    }

    .cake-card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      width: 100%;
      max-width: 300px;
    }

    .cake-image {
      aspect-ratio: 4/3;
      background: #fdeeed;
    }

    .cake-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 10px;
    }

    .cake-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .price {
      font-size: 1rem;
      font-weight: 700;
    }

    .rating {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .star {
      color: #1da64a;
      font-weight: 700;
    }

    .card-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.84rem;
    }

    .primary {
      background: var(--brand);
      color: white;
    }

    .secondary {
      background: #f3f0ee;
      color: #3c2d25;
    }

    .ghost {
      background: white;
      border: 1px solid var(--border);
      color: #3c2d25;
    }

    .sidebar {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 16px;
      position: sticky;
      top: 90px;
      min-width: 0;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }

    .basket-item {
      border-bottom: 1px solid #f0ebe7;
      padding: 10px 0;
    }

    .basket-item:last-child {
      border-bottom: none;
    }

    .basket-name {
      font-weight: 700;
    }

    .basket-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .basket-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ececec;
      font-weight: 700;
    }

    .panel {
      margin-top: 18px;
      border-top: 1px solid #efefef;
      padding-top: 14px;
    }

    .panel form {
      display: grid;
      gap: 8px;
    }

    .panel input,
    .panel textarea,
    .panel select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      width: 100%;
      font-family: inherit;
    }

    .panel textarea {
      min-height: 72px;
      resize: vertical;
    }

    .auth-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      background: #f8f6f4;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      color: #3c2d25;
    }

    .auth-tab.active-tab {
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-card {
      background: #fff7f4;
      border: 1px solid #ebdcd5;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .orders-list-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      background: #faf8f6;
    }

    .message {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .message.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #f4c5ca;
    }

    .message.success {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid #c7e9d2;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      z-index: 50;
      padding: 16px;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(640px, 100%);
      max-height: 82vh;
      overflow: auto;
      background: white;
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .review-item {
      border-top: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.94rem;
    }

    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: 60vh;
        overflow-y: auto;
      }

      .cake-card {
        max-width: 300px;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Cake Delight</div>
    <div class="topbar-right">
      <span class="topbar-note">Fresh cakes, live basket totals, and real ratings</span>
      <div id="topbarUserNav"></div>
    </div>
  </header>

  <div class="hero">
    <h2>A Cake a Day Makes a Day</h2>
  </div>

  <div class="page">
    <div class="filters">
      <div id="categoryChips" class="filter-chip-group"></div>
      <input id="nameFilter" class="filter-input" placeholder="Name" />
      <select id="priceRange" class="filter-input">
        <option value="">All price ranges</option>
        <option value="0-600">Budget (up to ₹600)</option>
        <option value="601-800">Mid range (₹601 - ₹800)</option>
        <option value="801-1200">Premium (₹801 - ₹1200)</option>
      </select>
      <button id="applyFilters" class="filter-btn primary">Apply</button>
      <button id="resetFilters" class="filter-btn secondary">Reset</button>
    </div>
    <div id="catalogError" class="message"></div>

    <div class="layout">
      <section class="catalog-column">
        <h3>Cakes</h3>
        <div id="catalogLeft" class="catalog-grid"></div>
      </section>

      <section class="catalog-column">
        <h3>More Cakes</h3>
        <div id="catalogRight" class="catalog-grid"></div>
      </section>

      <aside class="sidebar">
        <!-- Auth Panel -->
        <section id="authSection" class="panel" style="margin-top:0; padding-top:0; border-top:none;">
          <div id="loggedOutView">
            <div class="auth-tabs">
              <button type="button" id="tabLogin" class="auth-tab active-tab">Login</button>
              <button type="button" id="tabRegister" class="auth-tab">Register</button>
            </div>
            <form id="loginForm" class="auth-form">
              <input id="loginUsername" type="text" placeholder="Username" required />
              <input id="loginPassword" type="password" placeholder="Password" required />
              <button type="submit" class="primary">Log in</button>
            </form>
            <form id="registerForm" class="auth-form" style="display: none;">
              <input id="regUsername" type="text" placeholder="Username (min 3 chars)" required />
              <input id="regEmail" type="email" placeholder="Email" required />
              <input id="regPassword" type="password" placeholder="Password (min 6 chars)" required />
              <button type="submit" class="primary">Register</button>
            </form>
            <div id="authMessage" class="message"></div>
          </div>
          <div id="loggedInView" style="display: none;">
            <div class="user-card">
              <div>Logged in as: <strong id="userNameDisplay"></strong></div>
              <div class="muted">Role: <span id="userRoleDisplay"></span></div>
              <button type="button" id="logoutBtn" class="ghost" style="width:100%; margin-top:8px;">Logout</button>
            </div>
          </div>
        </section>

        <h3>Basket</h3>
        <div id="basketSummary" class="muted"></div>
        <div id="basket"></div>
        <button id="checkout" class="primary" style="width:100%; margin-top: 12px;">Checkout</button>
        <div id="basketMessage" class="message"></div>

        <!-- Admin Panel (Shown only for ROLE_ADMIN) -->
        <section id="adminSection" class="panel" style="display:none; background:#fffbf7; border:1px solid #f2e2d5; border-radius:12px; padding:12px;">
          <h3 style="margin-top:0; color:#b23b14;">⚙️ Cake Management (Admin)</h3>
          <form id="adminCreateCakeForm">
            <input id="adminCakeName" type="text" placeholder="Cake Name" required />
            <input id="adminCakeCategory" type="text" placeholder="Category (e.g. Chocolate)" required />
            <input id="adminCakePrice" type="number" min="1" step="any" placeholder="Price (₹)" required />
            <input id="adminCakeStock" type="number" min="0" placeholder="Stock quantity" required />
            <textarea id="adminCakeDesc" placeholder="Description"></textarea>
            <input id="adminCakeImageUrl" type="url" placeholder="Image URL (optional)" />
            <button type="submit" class="primary" style="background:#b23b14;">Add Cake</button>
          </form>
          <div id="adminMessage" class="message"></div>
        </section>

        <section class="panel">
          <h3>Rate Cake</h3>
          <div style="font-size:0.85rem; margin-bottom:6px;">Posting rating as: <strong id="ratingUsernameDisplay">Please log in</strong></div>
          <form id="ratingForm">
            <input id="ratingCakeId" type="number" placeholder="Cake ID" required />
            <input id="ratingScore" type="number" min="1" max="5" placeholder="Score 1-5" required />
            <textarea id="ratingComment" placeholder="Comment"></textarea>
            <button type="submit" class="primary">Submit rating</button>
          </form>
          <div id="ratingMessage" class="message"></div>
        </section>

        <section id="userOrdersPanel" class="panel" style="display:none;">
          <h3>My Orders</h3>
          <div id="recentOrdersList"></div>
        </section>
      </aside>
    </div>
  </div>

  <div id="ratingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="ratingsModalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="ratingsModalTitle">Cake Ratings</h3>
        <button id="closeModal" class="ghost" type="button">Close</button>
      </div>
      <div id="ratingsModalSummary" class="muted"></div>
      <div id="ratingsModalError" class="message"></div>
      <div id="ratingsModalList"></div>
    </div>
  </div>

  <div id="editCakeModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editCakeModalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="editCakeModalTitle">Edit Cake</h3>
        <button id="closeEditModal" class="ghost" type="button">Close</button>
      </div>
      <form id="adminEditCakeForm" style="display:grid; gap:8px;">
        <input id="editCakeId" type="hidden" />
        <div>
          <label class="muted" style="font-size:0.8rem;">Cake Name</label>
          <input id="editCakeName" type="text" required style="width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px;" />
        </div>
        <div>
          <label class="muted" style="font-size:0.8rem;">Category</label>
          <input id="editCakeCategory" type="text" required style="width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px;" />
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <div>
            <label class="muted" style="font-size:0.8rem;">Price (₹)</label>
            <input id="editCakePrice" type="number" min="1" step="any" required style="width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px;" />
          </div>
          <div>
            <label class="muted" style="font-size:0.8rem;">Stock</label>
            <input id="editCakeStock" type="number" min="0" required style="width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px;" />
          </div>
        </div>
        <div>
          <label class="muted" style="font-size:0.8rem;">Description</label>
          <textarea id="editCakeDesc" style="width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; min-height:60px;"></textarea>
        </div>
        <div>
          <label class="muted" style="font-size:0.8rem;">Image URL</label>
          <input id="editCakeImageUrl" type="url" style="width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px;" />
        </div>
        <button type="submit" class="primary" style="margin-top:8px;">Save Changes</button>
      </form>
      <div id="editCakeMessage" class="message"></div>
    </div>
  </div>

  <script>
    const API = {
      catalog: "/api/catalog/cakes",
      cakeCreate: "/api/catalog/cakes",
      cakeUpdate: (id) => `/api/catalog/cakes/${id}`,
      cakeDelete: (id) => `/api/catalog/cakes/${id}`,
      cakeById: (id) => `/api/catalog/cakes/${id}`,
      basket: "/api/orders/basket",
      checkout: "/api/orders/checkout",
      ratingCreate: "/api/ratings",
      ratingAverage: (cakeId) => `/api/ratings/cakes/${cakeId}/average`,
      ratingList: (cakeId) => `/api/ratings/cakes/${cakeId}`,
      register: "/api/auth/register",
      login: "/api/auth/login",
      ordersList: "/api/orders",
      order: (id) => `/api/orders/${id}`,
      notifications: (orderId) => `/api/notifications/${orderId}`
    };

    const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=900&q=80";

    const catalogLeftEl = document.getElementById("catalogLeft");
    const catalogRightEl = document.getElementById("catalogRight");
    const categoryChipsEl = document.getElementById("categoryChips");
    const nameFilterEl = document.getElementById("nameFilter");
    const priceRangeEl = document.getElementById("priceRange");
    const basketEl = document.getElementById("basket");
    const basketSummaryEl = document.getElementById("basketSummary");
    const checkoutBtn = document.getElementById("checkout");

    const catalogErrorEl = document.getElementById("catalogError");
    const basketMessageEl = document.getElementById("basketMessage");
    const ratingMessageEl = document.getElementById("ratingMessage");
    const authMessageEl = document.getElementById("authMessage");

    const ratingsModalEl = document.getElementById("ratingsModal");
    const ratingsModalSummaryEl = document.getElementById("ratingsModalSummary");
    const ratingsModalErrorEl = document.getElementById("ratingsModalError");
    const ratingsModalListEl = document.getElementById("ratingsModalList");

    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loggedOutView = document.getElementById("loggedOutView");
    const loggedInView = document.getElementById("loggedInView");
    const userNameDisplay = document.getElementById("userNameDisplay");
    const userRoleDisplay = document.getElementById("userRoleDisplay");
    const logoutBtn = document.getElementById("logoutBtn");
    const topbarUserNav = document.getElementById("topbarUserNav");
    const userOrdersPanel = document.getElementById("userOrdersPanel");
    const recentOrdersListEl = document.getElementById("recentOrdersList");

    const adminSection = document.getElementById("adminSection");
    const adminCreateCakeForm = document.getElementById("adminCreateCakeForm");
    const adminMessage = document.getElementById("adminMessage");
    const editCakeModal = document.getElementById("editCakeModal");
    const closeEditModalBtn = document.getElementById("closeEditModal");
    const adminEditCakeForm = document.getElementById("adminEditCakeForm");
    const editCakeMessage = document.getElementById("editCakeMessage");
    const ratingUsernameDisplay = document.getElementById("ratingUsernameDisplay");

    let activeCategory = "";
    let allCategoriesSet = new Set();
    let currentBasket = { items: [], totalAmount: 0 };
    let currentModalCakeId = null;
    let lastCatalog = [];

    let authToken = null;
    let currentUser = null;

    function setMessage(element, text, type) {
      if (!element) return;
      element.className = "message";
      element.textContent = "";
      if (!text) {
        return;
      }
      element.textContent = text;
      element.classList.add(type);
    }

    function formatRupees(amount) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }).format(Number(amount || 0));
    }

    async function loadUserOrderHistory() {
      if (!recentOrdersListEl || !authToken || !currentUser) return;
      userOrdersPanel.style.display = "block";
      recentOrdersListEl.innerHTML = `<div class="muted">Loading order history...</div>`;

      const response = await apiJson(API.ordersList);
      if (!response.ok) {
        recentOrdersListEl.innerHTML = `<div class="muted">Failed to load orders.</div>`;
        return;
      }

      const orders = Array.isArray(response.data) ? response.data : [];
      if (!orders.length) {
        recentOrdersListEl.innerHTML = `<div class="muted">No orders placed yet.</div>`;
        return;
      }

      const orderCards = await Promise.all(orders.map(async (o) => {
        const notifRes = await apiJson(API.notifications(o.orderId));
        const dateStr = o.orderDate ? new Date(o.orderDate).toLocaleString() : "Recent";
        const itemsList = Array.isArray(o.items) && o.items.length
          ? `<div class="muted" style="font-size:0.85rem; margin-top:4px;"><strong>Items:</strong> ${o.items.map(i => `${i.cakeName} ×${i.quantity}`).join(", ")}</div>`
          : "";

        let notifHtml = "";
        if (notifRes.ok && Array.isArray(notifRes.data) && notifRes.data.length) {
          notifHtml = notifRes.data.map(n => `
            <div class="muted" style="font-size:0.8rem; margin-top:2px;">
              ✉️ ${n.channel}: <strong>${n.status}</strong>
            </div>
          `).join("");
        }

        return `
          <div class="orders-list-item">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>Order #${o.orderId}</strong>
              <span style="font-size:0.75rem; font-weight:700; padding:2px 8px; border-radius:4px; background:#eef9ef; color:#0f6d2f;">${o.status}</span>
            </div>
            <div class="muted" style="font-size:0.8rem; margin-top:2px;">Date: ${dateStr}</div>
            <div style="font-weight:700; margin-top:4px;">Total: ${formatRupees(o.totalAmount)}</div>
            ${itemsList}
            ${notifHtml}
          </div>
        `;
      }));

      recentOrdersListEl.innerHTML = orderCards.join("");
    }

    function loadAuthState() {
      const storedToken = localStorage.getItem("jwt_token");
      const storedUser = localStorage.getItem("user_info");
      if (storedToken && storedToken.trim() !== "") {
        authToken = storedToken;
        if (storedUser) {
          try {
            currentUser = JSON.parse(storedUser);
            if (typeof currentUser !== "object" || currentUser === null) {
              currentUser = { username: "User", role: "ROLE_USER" };
            }
          } catch (e) {
            currentUser = { username: "User", role: "ROLE_USER" };
          }
        } else {
          currentUser = { username: "User", role: "ROLE_USER" };
        }
      } else {
        clearAuthState();
      }
    }

    function saveAuthState(token, user) {
      authToken = token;
      currentUser = user;
      localStorage.setItem("jwt_token", token);
      localStorage.setItem("user_info", JSON.stringify(user));
    }

    function clearAuthState() {
      authToken = null;
      currentUser = null;
      localStorage.removeItem("jwt_token");
      localStorage.removeItem("user_info");
    }

    function renderAuthState() {
      const isAdmin = currentUser && currentUser.role === "ROLE_ADMIN";

      if (authToken && currentUser) {
        loggedOutView.style.display = "none";
        loggedInView.style.display = "block";
        userNameDisplay.textContent = currentUser.username || "User";
        userRoleDisplay.textContent = currentUser.role || "ROLE_USER";

        if (topbarUserNav) {
          topbarUserNav.innerHTML = `<span class="user-badge-header">👤 ${currentUser.username || 'User'} (${currentUser.role || 'USER'})</span>`;
        }

        if (ratingUsernameDisplay) {
          ratingUsernameDisplay.textContent = currentUser.username;
        }

        if (adminSection) {
          adminSection.style.display = isAdmin ? "block" : "none";
        }

        fetchAndRenderBasket();
        loadUserOrderHistory();
      } else {
        loggedOutView.style.display = "block";
        loggedInView.style.display = "none";

        if (topbarUserNav) {
          topbarUserNav.innerHTML = ``;
        }

        if (ratingUsernameDisplay) {
          ratingUsernameDisplay.textContent = "Please log in";
        }

        if (adminSection) {
          adminSection.style.display = "none";
        }

        if (userOrdersPanel) {
          userOrdersPanel.style.display = "none";
        }
        if (recentOrdersListEl) {
          recentOrdersListEl.innerHTML = "";
        }

        currentBasket = { items: [], totalAmount: 0 };
        renderBasketPanel(currentBasket);
      }

      if (lastCatalog && lastCatalog.length) {
        renderCatalog(lastCatalog);
      }
    }

    async function apiJson(url, options = {}) {
      try {
        const headers = { ...options.headers };
        if (authToken) {
          headers["Authorization"] = `Bearer ${authToken}`;
        }
        delete headers["X-User-Id"];
        delete headers["X-User-Role"];
        delete headers["X-User-Name"];
        delete headers["X-Internal-Secret"];

        const response = await fetch(url, { ...options, headers });
        const text = await response.text();
        const data = text ? JSON.parse(text) : null;

        if (!response.ok) {
          if (response.status === 401) {
            clearAuthState();
            renderAuthState();
            return {
              ok: false,
              status: 401,
              error: data?.message || "Please log in to continue."
            };
          }
          if (response.status === 403) {
            return {
              ok: false,
              status: 403,
              error: data?.message || "Access denied: insufficient permissions."
            };
          }
          return {
            ok: false,
            status: response.status,
            error: data?.message || `Request failed (${response.status})`
          };
        }
        return { ok: true, status: response.status, data };
      } catch (error) {
        return { ok: false, status: 0, error: "Network error. Please try again." };
      }
    }

    function buildCatalogQuery() {
      const params = new URLSearchParams();
      const name = nameFilterEl.value.trim();
      const selectedRange = priceRangeEl.value;

      let minPrice = "";
      let maxPrice = "";
      if (selectedRange) {
        const [min, max] = selectedRange.split("-");
        minPrice = min;
        maxPrice = max;
      }

      if (activeCategory) params.set("category", activeCategory);
      if (name) params.set("name", name);
      if (minPrice) params.set("minPrice", minPrice);
      if (maxPrice) params.set("maxPrice", maxPrice);

      return params.toString() ? `?${params.toString()}` : "";
    }

    function splitCatalog(cakes) {
      return cakes.reduce((columns, cake, index) => {
        columns[index % 2].push(cake);
        return columns;
      }, [[], []]);
    }

    function renderCategoryChips() {
      const sortedCategories = Array.from(allCategoriesSet).sort();
      const allActive = !activeCategory;
      let html = `<button class="filter-chip ${allActive ? 'active-chip' : ''}" data-category="">All</button>`;

      html += sortedCategories.map((category) => {
        const isSelected = (activeCategory === category);
        const activeClass = isSelected ? "active-chip" : "";
        const removeBtn = isSelected ? ` <span class="chip-remove" data-remove="true">×</span>` : "";
        return `<button class="filter-chip ${activeClass}" data-category="${category}">${category}${removeBtn}</button>`;
      }).join("");

      categoryChipsEl.innerHTML = html;

      categoryChipsEl.querySelectorAll(".filter-chip").forEach((button) => {
        button.addEventListener("click", async (e) => {
          const categoryValue = button.dataset.category || "";
          const isRemoveClick = e.target.classList.contains("chip-remove") || e.target.dataset.remove === "true";

          if (isRemoveClick || (activeCategory === categoryValue && categoryValue !== "")) {
            activeCategory = "";
          } else {
            activeCategory = categoryValue;
          }
          await fetchAndRenderCatalog();
        });
      });
    }

    function cardTemplate(cake) {
      const imageUrl = cake.imageUrl || FALLBACK_IMAGE;
      const isAdmin = currentUser && currentUser.role === "ROLE_ADMIN";
      const adminActions = isAdmin ? `
        <button class="ghost" type="button" style="color:#b23b14;" onclick="openEditCakeModal(${cake.id})">Edit</button>
        <button class="ghost" type="button" style="color:var(--brand);" onclick="deleteCakeAction(${cake.id})">Delete</button>
      ` : "";

      return `
        <article class="cake-card">
          <div class="cake-image">
            <img src="${imageUrl}" alt="${cake.name}" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'" />
          </div>
          <div class="card-body">
            <div class="cake-name">${cake.name}</div>
            <div class="muted">Cake ID: ${cake.id}</div>
            <div class="muted">${cake.category}</div>
            <div class="price-row">
              <div class="price">${formatRupees(cake.price)}</div>
            </div>
            <div class="rating" id="rating-summary-${cake.id}">Loading rating...</div>
            <div class="card-actions">
              <button class="primary" type="button" onclick="addToBasket(${cake.id})">Add to basket</button>
              <button class="secondary" type="button" onclick="openRatingsModal(${cake.id})">Ratings</button>
              ${adminActions}
            </div>
          </div>
        </article>
      `;
    }

    function renderCatalog(cakes) {
      const [leftColumn, rightColumn] = splitCatalog(cakes);
      catalogLeftEl.innerHTML = leftColumn.map(cardTemplate).join("");
      catalogRightEl.innerHTML = rightColumn.map(cardTemplate).join("");
    }

    async function refreshCakeAverage(cakeId) {
      const target = document.getElementById(`rating-summary-${cakeId}`);
      if (!target) return;

      const response = await apiJson(API.ratingAverage(cakeId));
      if (!response.ok) {
        target.innerHTML = `<span class="muted">Rating unavailable</span>`;
        return;
      }

      const average = Number(response.data?.average || 0);
      const count = Number(response.data?.count || 0);
      target.innerHTML = `<span class="star">★</span> ${average.toFixed(1)} <span class="muted">(${count} reviews)</span>`;
    }

    async function fetchAndRenderCatalog() {
      setMessage(catalogErrorEl, "", "");
      const response = await apiJson(`${API.catalog}${buildCatalogQuery()}`);
      if (!response.ok) {
        setMessage(catalogErrorEl, response.error, "error");
        return;
      }

      lastCatalog = Array.isArray(response.data) ? response.data : [];
      lastCatalog.forEach((cake) => {
        if (cake.category) allCategoriesSet.add(cake.category);
      });
      renderCategoryChips();
      renderCatalog(lastCatalog);
      await Promise.all(lastCatalog.map((cake) => refreshCakeAverage(cake.id)));
    }

    function renderBasketPanel(basket) {
      const items = basket.items || [];
      basketSummaryEl.innerHTML = `<div class="basket-total">Basket total: ${formatRupees(basket.totalAmount || 0)}</div>`;

      if (!authToken) {
        basketEl.innerHTML = `<div class="muted">Please log in to view and manage your basket.</div>`;
        checkoutBtn.disabled = true;
        checkoutBtn.classList.add("secondary");
        checkoutBtn.classList.remove("primary");
        return;
      }

      if (!items.length) {
        basketEl.innerHTML = `<div class="muted">Your basket is empty.</div>`;
        checkoutBtn.disabled = true;
        checkoutBtn.classList.add("secondary");
        checkoutBtn.classList.remove("primary");
        return;
      }

      checkoutBtn.disabled = false;
      checkoutBtn.classList.add("primary");
      checkoutBtn.classList.remove("secondary");
      basketEl.innerHTML = items.map((item) => `
        <div class="basket-item">
          <div class="basket-name">${item.cakeName}</div>
          <div class="muted">Qty ${item.quantity} • ${formatRupees(item.subtotal)}</div>
          <div class="basket-controls">
            <button class="ghost" type="button" onclick="updateBasketItem(${item.id}, ${item.cakeId}, ${Math.max(1, item.quantity - 1)})">−</button>
            <button class="ghost" type="button" onclick="updateBasketItem(${item.id}, ${item.cakeId}, ${item.quantity + 1})">+</button>
            <button class="ghost" type="button" onclick="removeBasketItem(${item.id})">Delete</button>
          </div>
        </div>
      `).join("");
    }

    async function fetchAndRenderBasket() {
      if (!authToken) {
        renderBasketPanel({ items: [], totalAmount: 0 });
        return;
      }
      const response = await apiJson(API.basket);
      if (!response.ok) {
        setMessage(basketMessageEl, response.error, "error");
        return;
      }
      currentBasket = response.data || { items: [], totalAmount: 0 };
      renderBasketPanel(currentBasket);
    }

    async function addToBasket(cakeId) {
      setMessage(basketMessageEl, "", "");
      if (!authToken) {
        setMessage(basketMessageEl, "Please log in to add items to your basket.", "error");
        return;
      }

      const response = await apiJson(API.basket, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cakeId, quantity: 1 })
      });

      if (!response.ok) {
        setMessage(basketMessageEl, response.error, "error");
        return;
      }

      await fetchAndRenderBasket();
      setMessage(basketMessageEl, "Added to basket", "success");
    }

    async function updateBasketItem(itemId, cakeId, quantity) {
      setMessage(basketMessageEl, "", "");
      if (!authToken) {
        setMessage(basketMessageEl, "Please log in to manage your basket.", "error");
        return;
      }

      const response = await apiJson(`${API.basket}/${itemId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cakeId, quantity })
      });

      if (!response.ok) {
        setMessage(basketMessageEl, response.error, "error");
        return;
      }

      await fetchAndRenderBasket();
      setMessage(basketMessageEl, "Basket updated", "success");
    }

    async function removeBasketItem(itemId) {
      setMessage(basketMessageEl, "", "");
      if (!authToken) {
        setMessage(basketMessageEl, "Please log in to manage your basket.", "error");
        return;
      }

      const response = await apiJson(`${API.basket}/${itemId}`, {
        method: "DELETE"
      });

      if (!response.ok) {
        setMessage(basketMessageEl, response.error, "error");
        return;
      }

      await fetchAndRenderBasket();
      setMessage(basketMessageEl, "Item removed", "success");
    }

    async function checkout() {
      setMessage(basketMessageEl, "", "");

      if (!authToken) {
        setMessage(basketMessageEl, "Please log in to checkout.", "error");
        return;
      }

      if (!currentBasket.items || !currentBasket.items.length) {
        setMessage(basketMessageEl, "Basket is empty. Add items before checkout.", "error");
        return;
      }

      checkoutBtn.disabled = true;
      const response = await apiJson(API.checkout, { method: "POST" });
      checkoutBtn.disabled = false;

      if (!response.ok) {
        setMessage(basketMessageEl, response.error, "error");
        return;
      }

      const order = response.data?.order;
      if (!order || !order.orderId) {
        setMessage(basketMessageEl, "Checkout response is incomplete.", "error");
        return;
      }

      setMessage(
        basketMessageEl,
        `Checkout successful: Order #${order.orderId}, Total ${formatRupees(order.totalAmount)}, Status ${order.status}. Check email for details.`,
        "success"
      );

      saveUserOrderId(currentUser.id, order.orderId);
      await fetchAndRenderBasket();
      await loadUserOrderHistory();
    }

    async function openRatingsModal(cakeId) {
      currentModalCakeId = cakeId;
      ratingsModalEl.classList.add("open");
      ratingsModalSummaryEl.textContent = "Loading ratings...";
      ratingsModalListEl.innerHTML = "";
      setMessage(ratingsModalErrorEl, "", "");

      const [avgRes, listRes] = await Promise.all([
        apiJson(API.ratingAverage(cakeId)),
        apiJson(API.ratingList(cakeId))
      ]);

      if (!avgRes.ok) {
        setMessage(ratingsModalErrorEl, avgRes.error, "error");
        return;
      }

      if (!listRes.ok) {
        setMessage(ratingsModalErrorEl, listRes.error, "error");
        return;
      }

      const average = Number(avgRes.data?.average || 0);
      const count = Number(avgRes.data?.count || 0);
      ratingsModalSummaryEl.textContent = `Average ${average.toFixed(1)} from ${count} review(s)`;

      const reviews = Array.isArray(listRes.data) ? listRes.data : [];
      ratingsModalListEl.innerHTML = reviews.length
        ? reviews.map((review) => {
            const isCurrentUser = currentUser && (Number(review.userId) === Number(currentUser.id));
            const userLabel = isCurrentUser ? `👤 ${currentUser.username}` : `👤 Customer`;
            const dateStr = review.createdAt ? new Date(review.createdAt).toLocaleDateString() : "";
            return `
              <div class="review-item">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <strong class="star">★ ${review.score}/5</strong>
                  <span class="muted" style="font-size:0.82rem;">${dateStr}</span>
                </div>
                <div style="font-weight:700; font-size:0.88rem; margin-top:2px;">${userLabel}</div>
                <div style="margin-top:4px;">${review.comment || "No comment"}</div>
              </div>
            `;
          }).join("")
        : `<div class="muted">No reviews for this cake yet.</div>`;
    }

    function closeRatingsModal() {
      ratingsModalEl.classList.remove("open");
      currentModalCakeId = null;
    }

    async function submitRating(event) {
      event.preventDefault();
      setMessage(ratingMessageEl, "", "");

      if (!authToken || !currentUser) {
        setMessage(ratingMessageEl, "Please log in to submit a rating.", "error");
        return;
      }

      const cakeId = Number(document.getElementById("ratingCakeId").value);
      const userId = currentUser.id;

      if (!userId) {
        setMessage(ratingMessageEl, "User ID not found in session. Please log in again.", "error");
        return;
      }

      const payload = {
        cakeId,
        userId: Number(userId),
        score: Number(document.getElementById("ratingScore").value),
        comment: document.getElementById("ratingComment").value
      };

      const response = await apiJson(API.ratingCreate, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        setMessage(ratingMessageEl, response.error, "error");
        return;
      }

      await refreshCakeAverage(cakeId);
      if (currentModalCakeId === cakeId) {
        await openRatingsModal(cakeId);
      }
      setMessage(ratingMessageEl, "Rating submitted successfully!", "success");
      document.getElementById("ratingComment").value = "";
    }

    if (adminCreateCakeForm) {
      adminCreateCakeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMessage(adminMessage, "", "");

        const name = document.getElementById("adminCakeName").value.trim();
        const category = document.getElementById("adminCakeCategory").value.trim();
        const price = Number(document.getElementById("adminCakePrice").value);
        const stock = Number(document.getElementById("adminCakeStock").value);
        const description = document.getElementById("adminCakeDesc").value.trim();
        const imageUrl = document.getElementById("adminCakeImageUrl").value.trim();

        const response = await apiJson(API.cakeCreate, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, category, price, stock, description, imageUrl })
        });

        if (!response.ok) {
          setMessage(adminMessage, response.error, "error");
          return;
        }

        setMessage(adminMessage, `Cake "${name}" created successfully!`, "success");
        adminCreateCakeForm.reset();
        await fetchAndRenderCatalog();
      });
    }

    async function openEditCakeModal(cakeId) {
      setMessage(editCakeMessage, "", "");
      const response = await apiJson(API.cakeById(cakeId));
      if (!response.ok) {
        alert("Failed to load cake details: " + response.error);
        return;
      }
      const cake = response.data;
      document.getElementById("editCakeId").value = cake.id;
      document.getElementById("editCakeName").value = cake.name || "";
      document.getElementById("editCakeCategory").value = cake.category || "";
      document.getElementById("editCakePrice").value = cake.price || 0;
      document.getElementById("editCakeStock").value = cake.stock || 0;
      document.getElementById("editCakeDesc").value = cake.description || "";
      document.getElementById("editCakeImageUrl").value = cake.imageUrl || "";

      editCakeModal.classList.add("open");
    }

    function closeEditCakeModal() {
      editCakeModal.classList.remove("open");
      setMessage(editCakeMessage, "", "");
    }

    if (closeEditModalBtn) {
      closeEditModalBtn.addEventListener("click", closeEditCakeModal);
    }
    if (editCakeModal) {
      editCakeModal.addEventListener("click", (e) => {
        if (e.target === editCakeModal) closeEditCakeModal();
      });
    }

    if (adminEditCakeForm) {
      adminEditCakeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMessage(editCakeMessage, "", "");

        const id = document.getElementById("editCakeId").value;
        const name = document.getElementById("editCakeName").value.trim();
        const category = document.getElementById("editCakeCategory").value.trim();
        const price = Number(document.getElementById("editCakePrice").value);
        const stock = Number(document.getElementById("editCakeStock").value);
        const description = document.getElementById("editCakeDesc").value.trim();
        const imageUrl = document.getElementById("editCakeImageUrl").value.trim();

        const response = await apiJson(API.cakeUpdate(id), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, category, price, stock, description, imageUrl })
        });

        if (!response.ok) {
          setMessage(editCakeMessage, response.error, "error");
          return;
        }

        setMessage(editCakeMessage, `Cake updated successfully!`, "success");
        setTimeout(() => {
          closeEditCakeModal();
          fetchAndRenderCatalog();
        }, 800);
      });
    }

    async function deleteCakeAction(cakeId) {
      if (!confirm(`Are you sure you want to delete cake #${cakeId}?`)) return;

      const response = await apiJson(API.cakeDelete(cakeId), {
        method: "DELETE"
      });

      if (!response.ok) {
        alert("Failed to delete cake: " + response.error);
        return;
      }

      await fetchAndRenderCatalog();
    }

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active-tab");
      tabRegister.classList.remove("active-tab");
      loginForm.style.display = "flex";
      registerForm.style.display = "none";
      setMessage(authMessageEl, "", "");
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.classList.add("active-tab");
      tabLogin.classList.remove("active-tab");
      registerForm.style.display = "flex";
      loginForm.style.display = "none";
      setMessage(authMessageEl, "", "");
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMessage(authMessageEl, "", "");

      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!username) {
        setMessage(authMessageEl, "Username is required.", "error");
        return;
      }
      if (!password) {
        setMessage(authMessageEl, "Password is required.", "error");
        return;
      }

      const response = await apiJson(API.login, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (!response.ok) {
        setMessage(authMessageEl, response.error, "error");
        return;
      }

      const { token, id, email, role } = response.data;
      saveAuthState(token, { id, username, email, role });
      document.getElementById("loginPassword").value = "";
      renderAuthState();
      setMessage(authMessageEl, "Login successful!", "success");
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMessage(authMessageEl, "", "");

      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      if (!username) {
        setMessage(authMessageEl, "Username is required.", "error");
        return;
      }
      if (!email) {
        setMessage(authMessageEl, "Email is required.", "error");
        return;
      }
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        setMessage(authMessageEl, "Please enter a valid email address.", "error");
        return;
      }
      if (!password) {
        setMessage(authMessageEl, "Password is required.", "error");
        return;
      }
      if (password.length < 6) {
        setMessage(authMessageEl, "Password must be at least 6 characters long.", "error");
        return;
      }

      const response = await apiJson(API.register, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password })
      });

      if (!response.ok) {
        setMessage(authMessageEl, response.error, "error");
        return;
      }

      document.getElementById("regPassword").value = "";
      setMessage(authMessageEl, `Registration successful for ${username}! Please log in.`, "success");
      tabLogin.click();
      document.getElementById("loginUsername").value = username;
      document.getElementById("loginPassword").focus();
    });

    logoutBtn.addEventListener("click", () => {
      clearAuthState();
      renderAuthState();
      document.getElementById("loginUsername").value = "";
      document.getElementById("loginPassword").value = "";
      document.getElementById("regUsername").value = "";
      document.getElementById("regEmail").value = "";
      document.getElementById("regPassword").value = "";
      setMessage(basketMessageEl, "Logged out successfully.", "success");
    });

    document.getElementById("applyFilters").addEventListener("click", fetchAndRenderCatalog);
    document.getElementById("resetFilters").addEventListener("click", async () => {
      activeCategory = "";
      nameFilterEl.value = "";
      priceRangeEl.value = "";
      await fetchAndRenderCatalog();
    });
    document.getElementById("checkout").addEventListener("click", checkout);
    document.getElementById("ratingForm").addEventListener("submit", submitRating);
    document.getElementById("closeModal").addEventListener("click", closeRatingsModal);
    ratingsModalEl.addEventListener("click", (event) => {
      if (event.target === ratingsModalEl) {
        closeRatingsModal();
      }
    });

    window.addToBasket = addToBasket;
    window.updateBasketItem = updateBasketItem;
    window.removeBasketItem = removeBasketItem;
    window.openRatingsModal = openRatingsModal;
    window.openEditCakeModal = openEditCakeModal;
    window.deleteCakeAction = deleteCakeAction;

    loadAuthState();
    renderAuthState();
    fetchAndRenderCatalog();
  </script>
</body>
</html>
