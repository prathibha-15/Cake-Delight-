apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          args:
            - -smtp-bind-addr=0.0.0.0:1025
            - -ui-bind-addr=0.0.0.0:8025
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: cake-delight
spec:
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
