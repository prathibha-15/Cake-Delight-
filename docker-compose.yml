services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cake-network

  mysql:
    image: mysql:8.0
    container_name: cake-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Sweetlife&15

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pSweetlife&15"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cake-network

  catalog-service:
    build:
      context: ./catalog-service

    container_name: catalog-service

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cake_catalog
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      GATEWAY_INTERNAL_SECRET: "c2VjcmV0LWtleS1jYWtlLWRlbGlnaHQtdjItc3VwZXItc2VjcmV0LXNlY3JldC1rZXk="

    networks:
      - cake-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  order-service:
    build:
      context: ./order-service

    container_name: order-service

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cake_order
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      GATEWAY_INTERNAL_SECRET: "c2VjcmV0LWtleS1jYWtlLWRlbGlnaHQtdjItc3VwZXItc2VjcmV0LXNlY3JldC1rZXk="

    networks:
      - cake-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rating-service:
    build:
      context: ./rating-service

    container_name: rating-service

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cake_rating
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      GATEWAY_INTERNAL_SECRET: "c2VjcmV0LWtleS1jYWtlLWRlbGlnaHQtdjItc3VwZXItc2VjcmV0LXNlY3JldC1rZXk="

    networks:
      - cake-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - cake-network

  notification-service:
    build:
      context: ./notification-service

    container_name: notification-service

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      NOTIFICATION_MAIL_ENABLED: "true"
      NOTIFICATION_MAIL_FROM: no-reply@cakedelight.local
      NOTIFICATION_MAIL_TO: demo@cakedelight.local
      NOTIFICATION_MAIL_SUBJECT_PREFIX: "[Cake Delight]"
      GATEWAY_INTERNAL_SECRET: "c2VjcmV0LWtleS1jYWtlLWRlbGlnaHQtdjItc3VwZXItc2VjcmV0LXNlY3JldC1rZXk="

    networks:
      - cake-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  user-service:
    build:
      context: ./user-service

    container_name: user-service

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      GATEWAY_INTERNAL_SECRET: "c2VjcmV0LWtleS1jYWtlLWRlbGlnaHQtdjItc3VwZXItc2VjcmV0LXNlY3JldC1rZXk="

    networks:
      - cake-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      rating-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      user-service:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      USER_SERVICE_URL: http://user-service:8085
      GATEWAY_INTERNAL_SECRET: "c2VjcmV0LWtleS1jYWtlLWRlbGlnaHQtdjItc3VwZXItc2VjcmV0LXNlY3JldC1rZXk="

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - cake-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:

networks:
  cake-network: