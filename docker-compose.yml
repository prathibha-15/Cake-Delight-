
services:

  mysql:
    image: mysql:8.4
    container_name: cake-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Sweetlife&15
      MYSQL_DATABASE: cake_catalog

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pSweetlife&15"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cake-network

  catalog-service:
    build:
      context: ./catalog-service

    container_name: catalog-service

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cake_catalog
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15

    networks:
      - cake-network

volumes:
  mysql-data:

networks:
  cake-network: