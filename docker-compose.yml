services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cake-network

  mysql:
    image: mysql:8.0
    container_name: cake-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Sweetlife&15

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pSweetlife&15"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cake-network

  catalog-service:
    build:
      context: ./catalog-service

    container_name: catalog-service

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cake_catalog
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15

    networks:
      - cake-network

  order-service:
    build:
      context: ./order-service

    container_name: order-service

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cake_order
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest

    networks:
      - cake-network

  rating-service:
    build:
      context: ./rating-service

    container_name: rating-service

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8083:8083"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cake_rating
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15

    networks:
      - cake-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - cake-network

  notification-service:
    build:
      context: ./notification-service

    container_name: notification-service

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

    ports:
      - "8084:8084"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sweetlife&15
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      NOTIFICATION_MAIL_ENABLED: "true"
      NOTIFICATION_MAIL_FROM: no-reply@cakedelight.local
      NOTIFICATION_MAIL_TO: demo@cakedelight.local
      NOTIFICATION_MAIL_SUBJECT_PREFIX: "[Cake Delight]"

    networks:
      - cake-network

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    depends_on:
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      rating-service:
        condition: service_started
      notification-service:
        condition: service_started

    ports:
      - "8080:8080"

    networks:
      - cake-network

volumes:
  mysql-data:

networks:
  cake-network: